name: Deploy a GitHub Pages

# Publica la PWA (archivos estáticos) en GitHub Pages en cada push a la branch.
on:
  push:
    branches:
      - claude/leo-finance-app-40wvef
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un solo deploy a la vez; cancela el anterior si llega uno nuevo.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      # El sitio es estático y el CSS ya está compilado (css/styles.css),
      # así que se sube la raíz del repo tal cual.
      - name: Subir artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
